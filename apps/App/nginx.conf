server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # This manifest is polled by already-open clients to discover a deployment.
    location = /version.json {
        try_files $uri =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires -1;
    }

    # Never pin the app shell; it is the entry point to each new hashed bundle.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires -1;
    }

    # Vite emits content-hashed assets, so these can be cached permanently.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # React Router owns application routes such as /auth/callback.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }
}
