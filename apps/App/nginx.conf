server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite emits hashed assets, so they can be cached permanently.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # React Router owns application routes such as /auth/callback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
