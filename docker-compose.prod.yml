services:
  redis:
    image: redis:7-alpine
    container_name: tradepilot-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    networks:
      - tradepilot_default
    volumes:
      - redis-data:/data

  api:
    build:
      context: .
      dockerfile: apps/Server/Dockerfile
    container_name: tradepilot-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 4000
      API_PORT: 4000
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis
    networks:
      - tradepilot_default
    ports:
      - "4000:4000"

  app:
    build:
      context: .
      dockerfile: apps/App/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_WS_BASE_URL: ${VITE_WS_BASE_URL:-auto}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_MAGIC_LINK_REDIRECT_PATH: ${VITE_MAGIC_LINK_REDIRECT_PATH:-/auth/callback}
    container_name: tradepilot-frontend
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - tradepilot_default
      - nginx_proxy_manager
    ports:
      - "${WEB_PORT:-8080}:80"

networks:
  tradepilot_default:
    driver: bridge
  nginx_proxy_manager:
    external: true
    name: nginx-proxy-manager_default

volumes:
  redis-data:
