version: "3.9"

# Redis is shared with cryptobot: external container `shared-redis`, reachable
# as `redis` on the external `tradepilot_tradepilot_default` network (logical DB 0
# for tradepilot, DB 1 for cryptobot). TradePilot no longer runs its own Redis
# service.

services:
  api:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: tradepilot-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 4000
      API_PORT: 4000
      REDIS_URL: redis://redis:6379
    ports:
      - "${API_PORT:-4000}:4000"

  app:
    build:
      context: .
      dockerfile: apps/App/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_WS_BASE_URL: ${VITE_WS_BASE_URL:-auto}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-https://your-project-ref.supabase.co}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-replace-with-your-supabase-anon-key}
        VITE_MAGIC_LINK_REDIRECT_PATH: ${VITE_MAGIC_LINK_REDIRECT_PATH:-/auth/callback}
    container_name: tradepilot-frontend
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - default
      - nginx_proxy_manager
    ports:
      - "${WEB_PORT:-8080}:80"

networks:
  default:
    external: true
    name: tradepilot_tradepilot_default
  nginx_proxy_manager:
    external: true
    name: nginx-proxy-manager_default
